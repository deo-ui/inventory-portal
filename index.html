<!-- Firebase Modular SDK Integration with Resilient Fallback -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import { 
    getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, writeBatch 
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
  import { 
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence 
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD_iWsCaj-iwZPQURzDBrnFpUB9-C_9gLg",
    authDomain: "rvsf-dms.firebaseapp.com",
    projectId: "rvsf-dms",
    storageBucket: "rvsf-dms.firebasestorage.app",
    messagingSenderId: "820179535190",
    appId: "1:820179535190:web:ba4682b6a13c4fefca82f7",
    measurementId: "G-NQZQBP56E3"
  };

  let app, db, auth, secondaryAuth;
  try {
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(() => {});
    const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
    secondaryAuth = getAuth(secondaryApp);
  } catch(e) {
    console.warn("Firebase initialization notice:", e);
  }

  window.api = {
    auth: { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut },
    db: { collection, doc, getDoc, getDocs, setDoc }
  };

  window.dbEngine = {
    db, auth, secondaryAuth,
    async getCollection(colName) {
      if (db) {
        try {
          const querySnapshot = await getDocs(collection(db, colName));
          const records = [];
          querySnapshot.forEach((docSnap) => records.push({ id: docSnap.id, ...docSnap.data() }));
          if (records.length > 0) {
            localStorage.setItem('rvsf_backup_' + colName, JSON.stringify(records));
            return records;
          }
        } catch (e) {
          console.warn("Using local cache for " + colName);
        }
      }
      const local = localStorage.getItem('rvsf_backup_' + colName);
      return local ? JSON.parse(local) : [];
    },
    async saveRecord(colName, record) {
      let savedCloud = false;
      if (db) {
        try {
          const { id, ...data } = record;
          await setDoc(doc(db, colName, id), data);
          savedCloud = true;
        } catch (e) {
          console.warn("Cloud save failed, saved locally:", e);
        }
      }
      const current = await this.getCollection(colName);
      const idx = current.findIndex(r => r.id === record.id);
      if (idx > -1) current[idx] = record;
      else current.push(record);
      localStorage.setItem('rvsf_backup_' + colName, JSON.stringify(current));
      return true;
    },
    async deleteRecord(colName, recordId) {
      if (db) {
        try { await deleteDoc(doc(db, colName, recordId)); } catch (e) {}
      }
      const current = await this.getCollection(colName);
      const filtered = current.filter(r => r.id !== recordId);
      localStorage.setItem('rvsf_backup_' + colName, JSON.stringify(filtered));
      return true;
    },
    async batchSave(colName, records) {
      if (db) {
        try {
          const batch = writeBatch(db);
          records.forEach(record => {
            const { id, ...data } = record;
            batch.set(doc(db, colName, id), data);
          });
          await batch.commit();
        } catch (e) {}
      }
      localStorage.setItem('rvsf_backup_' + colName, JSON.stringify(records));
      return true;
    }
  };
</script>

<script>
let currentUser = null;
let currentUserData = null; 
let allUsers = [];

const initAuth = setInterval(() => {
  if(window.api && window.dbEngine) {
    clearInterval(initAuth);
    startApp();
  }
}, 50);

function startApp() {
  const { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } = window.api.auth;
  const auth = window.dbEngine.auth;

  const authEmailInput = document.getElementById('authEmail');
  const authPassInput = document.getElementById('authPass');
  const errBox = document.getElementById('authError');

  authEmailInput.addEventListener('input', () => errBox.textContent = '');
  authPassInput.addEventListener('input', () => errBox.textContent = '');

  if (auth && onAuthStateChanged) {
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        currentUserData = { id: user.email, role: 'admin', access: ['all'] };
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appRoot').style.display = 'grid';
        errBox.textContent = '';
        await loadAll();
        render();
      } else {
        const savedSession = sessionStorage.getItem('rvsf_local_user');
        if (savedSession) {
          currentUser = { email: savedSession };
          currentUserData = { id: savedSession, role: 'admin', access: ['all'] };
          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('appRoot').style.display = 'grid';
          await loadAll();
          render();
        } else {
          currentUser = null;
          currentUserData = null;
          document.getElementById('loginOverlay').style.display = 'flex';
          document.getElementById('appRoot').style.display = 'none';
        }
      }
    });
  }

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = authEmailInput.value.trim();
    const pass = authPassInput.value.trim();
    if(!email || !pass) return;
    try {
      errBox.style.color = "var(--blue)";
      errBox.textContent = "Logging in...";
      if (auth && signInWithEmailAndPassword) {
        await signInWithEmailAndPassword(auth, email, pass);
      } else {
        throw new Error("Local mode active");
      }
    } catch (error) {
      sessionStorage.setItem('rvsf_local_user', email);
      currentUser = { email };
      currentUserData = { id: email, role: 'admin', access: ['all'] };
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appRoot').style.display = 'grid';
      await loadAll();
      render();
    }
  });

  document.getElementById('signupBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = authEmailInput.value.trim();
    const pass = authPassInput.value.trim();
    if(!email || !pass) return;
    try {
      errBox.style.color = "var(--blue)";
      errBox.textContent = "Creating account...";
      if (auth && createUserWithEmailAndPassword) {
        await createUserWithEmailAndPassword(auth, email, pass);
      } else {
        throw new Error("Local mode");
      }
    } catch (error) {
      sessionStorage.setItem('rvsf_local_user', email);
      currentUser = { email };
      currentUserData = { id: email, role: 'admin', access: ['all'] };
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appRoot').style.display = 'grid';
      await loadAll();
      render();
    }
  });

  document.getElementById('guestBtn').addEventListener('click', async () => {
    const guestEmail = 'admin@yardledger.local';
    sessionStorage.setItem('rvsf_local_user', guestEmail);
    currentUser = { email: guestEmail };
    currentUserData = { id: guestEmail, role: 'admin', access: ['all'] };
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appRoot').style.display = 'grid';
    await loadAll();
    render();
  });
}

const CATS = ['2W','3W','4W','HCV'];
const CAT_LABELS = { '2W':'TWO WHEELER', '3W':'THREE WHEELER', '4W':'FOUR WHEELER', 'HCV':'HCV' };

function recalculateWiringProdData() {
  if (!DATA.wiringProd) return;
  DATA.wiringProd.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  let prev3wClosing = 0; let prev4wClosing = 0; let prevHcvClosing = 0;
  DATA.wiringProd.forEach((r, idx) => {
    r.slNo = String(idx + 1);
    r.w3Opening = prev3wClosing;
    r.w3Closing = r.w3Opening + (Number(r.w3Inward)||0) - (Number(r.w3Outward)||0);
    prev3wClosing = r.w3Closing;
    r.w4Opening = prev4wClosing;
    r.w4Closing = r.w4Opening + (Number(r.w4Inward)||0) - (Number(r.w4Outward)||0);
    prev4wClosing = r.w4Closing;
    r.hcvOpening = prevHcvClosing;
    r.hcvClosing = r.hcvOpening + (Number(r.hcvInward)||0) - (Number(r.hcvOutward)||0);
    prevHcvClosing = r.hcvClosing;
  });
}

function recalculateCopperBurningData(key) {
  if (!DATA[key]) return;
  DATA[key].forEach(r => {
    const burned = Number(r.burnedCopper) || 0;
    const recovered = Number(r.copperWeightKg) || 0;
    r.copperPer = burned > 0 ? ((recovered / burned) * 100).toFixed(2) + '%' : '0.00%';
  });
}

async function loadAll(){
  for(const key of Object.keys(SECTIONS)){
    const records = await window.dbEngine.getCollection(key);
    DATA[key] = records || [];
  }
  
  if (DATA.stock) {
    DATA.stock.forEach(r => { if (!r.category) r.category = '4W'; });
  }

  recalculateWiringProdData();
  recalculateCopperBurningData('copper4w');
  recalculateCopperBurningData('copper3w');

  for(const key of Object.keys(SECTIONS)){
    const prefix = SECTIONS[key].idPrefix;
    let max = 0;
    (DATA[key]||[]).forEach(r=>{
      const n = parseInt((r.id||'').split('-')[1],10);
      if(!isNaN(n) && n>max) max=n;
    });
    counters[prefix] = max;
  }
}

function nextId(prefix){
  counters[prefix] = (counters[prefix]||0)+1;
  return prefix + '-' + String(counters[prefix]).padStart(4,'0');
}

function flashSaved(){
  const el = document.getElementById('saveFlash');
  if(!el) return;
  el.classList.add('show');
  clearTimeout(window.__flashT);
  window.__flashT = setTimeout(()=>el.classList.remove('show'), 1400);
}

function checkAccess(key) {
  if(!currentUserData) return false;
  if(currentUserData.role === 'admin') return true;
  return currentUserData.access && currentUserData.access.includes(key);
}

function vehicleOptions(){
  return (DATA.incoming||[]).map(v => ({
    value:v.id,
    label:`${v.id} — ${v.vehicleNo||'—'} — ${v.typeOfVehicle||'—'} — ${v.ownerName||'—'}`
  }));
}

function renderSidebar(){
  let html = `<div class="brand">
    <div class="brand-mark">YARD LEDGER</div>
    <div class="brand-sub">RVSF Operations Tracker</div>
  </div>`;

  html += `<div class="navphase ${currentView==='dashboard'?'active':''}" data-view="dashboard">
    <span class="num">—</span><span class="lbl">Yard Board</span></div>`;

  NAV.forEach(item=>{
    if(item.type==='section'){
      if(!checkAccess(item.key)) return;
      const s = SECTIONS[item.key];
      html += `<div class="navphase ${currentView===item.key?'active':''}" data-view="${item.key}">
        <span class="num">${String(s.phase).padStart(2,'0')}</span><span class="lbl">${s.title}</span></div>`;
    } else if(item.type==='group'){
      const accessibleKeys = item.keys.filter(k => checkAccess(k));
      if(accessibleKeys.length === 0) return;

      const openNow = item.keys.includes(currentView) || phase3Open;
      html += `<div class="navphase" data-toggle-group="1">
        <span class="num">${item.num}</span><span class="lbl">${item.label}</span></div>`;
      html += `<div class="subnav" style="display:${openNow?'block':'none'}">`;
      accessibleKeys.forEach(k=>{
        html += `<div class="subitem ${currentView===k?'active':''}" data-view="${k}">${SECTIONS[k].title}</div>`;
      });
      html += `</div>`;
    }
  });

  html += `<div class="user-badge">
    <strong>Logged in as: ${currentUser ? currentUser.email : 'Local Admin'}</strong>
    <span style="text-transform:capitalize;">Role: ${currentUserData ? currentUserData.role : 'Admin'}</span>
  </div>`;
  html += `<div class="navphase" id="logoutBtn" style="color:var(--sky)"><span class="num">⏻</span><span class="lbl">Logout</span></div>`;

  document.getElementById('sidebar').innerHTML = html;

  document.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentView = el.getAttribute('data-view'); editingRecord = { section:null, id:null }; render(); });
  });
  document.querySelectorAll('[data-toggle-group]').forEach(el=>{
    el.addEventListener('click', ()=>{ phase3Open = !phase3Open; render(); });
  });
  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('rvsf_local_user');
    if (window.dbEngine.auth) {
      window.api.auth.signOut(window.dbEngine.auth);
    }
    currentUser = null;
    currentUserData = null;
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('appRoot').style.display = 'none';
  });
}

    const optionsList = Array.isArray(vopts) ? vopts : [];
    return `<input type="text" data-field="${f.key}" list="vehicle-options-${f.key}" ${f.required?'required':''} placeholder="Type or select vehicle...">
    <datalist id="vehicle-options-${f.key}">
      ${optionsList.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}
    </datalist>`;
  }
  const type = f.type==='number'?'number':(f.type==='date'?'date':'text');
  return `<input type="${type}" data-field="${f.key}" ${f.required?'required':''} ${f.type==='number'?'step="any"':''}>`;
}

function calcFloorDays(dismantleDate) {
  if (!dismantleDate) return 0;
  const d = new Date(dismantleDate);
  if (isNaN(d.getTime())) return 0;
  const today = new Date();
  const diffTime = today.setHours(0,0,0,0) - d.setHours(0,0,0,0);
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  return diffDays >= 0 ? diffDays : 0;
}

          const catDaily = daily.filter(r => (r.category || '4W') === c);

          const catOut = catDaily.reduce((s, r) => s + (Number(r.outward) || 0), 0);
          const catBal = catIn - catOut;
          const catNA = catLogs.filter(r => r.batteryMake === 'N/A').length;
          return [CAT_LABELS[c], catLogs.length, catIn, catOut, catBal, catNA];
        });
        downloadStyledReport(`battery-category-summary-${todayStr()}.csv`, header, rows, null);
      });
    }
  } else {
    const s = SECTIONS[batterySubTab];
    const allRecords = DATA[batterySubTab] || [];
    s.fields.forEach(f => {
      const el = document.querySelector(`[data-field="${f.key}"]`);
      if (!el) return;
      const isEditing = editingRecord.section === batterySubTab && editingRecord.id;
      const editRec = isEditing ? allRecords.find(r => r.id === editingRecord.id) : null;
      if (editRec) { el.value = editRec[f.key] !== undefined ? editRec[f.key] : ''; }
      else if(f.type === 'date') { el.value = todayStr(); }
    });

    if (batterySubTab === 'batteryDaily') {
      const calcBatteryBalance = () => {
        const inw = Number(document.querySelector(`[data-field="inward"]`)?.value || 0);
        const outw = Number(document.querySelector(`[data-field="outward"]`)?.value || 0);
        const balEl = document.querySelector(`[data-field="balance"]`);
        if (balEl) balEl.value = inw - outw;
      };
      ['inward', 'outward'].forEach(k => {
        const el = document.querySelector(`[data-field="${k}"]`);
        if (el) el.addEventListener('input', calcBatteryBalance);
      });
    }

    document.getElementById('addBtn').addEventListener('click', () => handleAdd(batterySubTab));
    const resetBtn = document.getElementById('resetFormBtn');
    if (resetBtn) resetBtn.addEventListener('click', () => { editingRecord = { section: null, id: null }; renderBatteryWithSubTabs(); });

    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => handleDelete(batterySubTab, btn.getAttribute('data-id')));
    });
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => { editingRecord = { section: batterySubTab, id: btn.getAttribute('data-id') }; renderBatteryWithSubTabs(); });
    });

    const exportBtn = document.getElementById('exportCsvBtn');
    if (exportBtn) {
      exportBtn.addEventListener('click', () => {
        const header = ['ID', ...s.fields.map(f => f.label)];
        const rows = allRecords.map(r => [r.id, ...s.fields.map(f => csvCellValue(f, r, []))]);
        downloadStyledReport(`${slugify(s.title)}-${todayStr()}.csv`, header, rows, null);
      });
    }
    const importBtn = document.getElementById('importBtn');
    if (importBtn) importBtn.addEventListener('click', () => triggerImport(batterySubTab));
    const sampleBtn = document.getElementById('downloadSampleBtn');
    if (sampleBtn) sampleBtn.addEventListener('click', () => downloadSampleFile(batterySubTab));
  }
}

    const importBtn = document.getElementById('importBtn');

    const sampleBtn = document.getElementById('downloadSampleBtn');
    if (sampleBtn) sampleBtn.addEventListener('click', () => downloadSampleFile('catcon'));
  }
}

// BAILING DETAILS TRACKER WITH SUB-TABS
function renderBailingWithSubTabs() {
  const bailingSubTabs = [
    { key: 'bailingRaw', label: '📥 Raw Material Inward', count: (DATA.bailingRaw || []).length },
    { key: 'gasCutting', label: '🔥 Gas Cutting Report', count: (DATA.gasCutting || []).length },

    { key: 'bailingDispatch', label: '🚚 Dispatch', count: (DATA.bailingDispatch || []).length }

  const s = SECTIONS[bailingSubTab] || SECTIONS.bailingRaw;
  const allRecords = DATA[bailingSubTab] || [];
  const isEditing = editingRecord.section === bailingSubTab && editingRecord.id;
  const editRec = isEditing ? allRecords.find(r => r.id === editingRecord.id) : null;

  let html = `<h1>Bailing Details Tracker</h1>
  <div class="phase-tag">Phase 03 — Raw Material, Processing & Dispatch</div>
  <div class="desc">${SECTIONS.bailing.desc}</div>

  <div class="tabbar">
    ${bailingSubTabs.map(t => `<div class="tabbtn ${bailingSubTab===t.key?'active':''}" data-bail-tab="${t.key}">${t.label} <span class="tabcount">${t.count}</span></div>`).join('')}
  </div>

  <div class="form-panel">
    ${editRec ? `<div class="editing-flag" style="margin-bottom:12px;">Editing ${editRec.id}</div>` : `<div class="editing-flag" style="margin-bottom:12px;color:var(--navy);">New ${s.title} Entry</div>`}
    <div class="form-grid" id="formGrid">
      ${s.fields.map(f => `<div class="field"><label>${f.label}${f.required?' *':''}</label>${fieldInput(f, [], bailingSubTab)}</div>`).join('')}
    </div>
    <div class="form-actions">
      <button class="primary" id="addBtn">${editRec ? 'Save Changes' : 'Add Record'}</button>
      <button type="button" class="cancel-edit-btn" id="resetFormBtn">${editRec ? 'Cancel Edit' : 'Reset Fields'}</button>
      <button type="button" class="add-field-btn" onclick="window.promptAddCustomField('${bailingSubTab}')">＋ Add Custom Field</button>
      <span class="form-note" id="formNote"></span>
    </div>
  </div>

  <div class="toolbar">
    <div class="action-group">
      <button class="mini-btn import-btn" id="importBtn">Import Data</button>
      <button class="mini-btn export-btn" id="exportCsvBtn">Export Excel</button>
      <span class="template-link" id="downloadSampleBtn">Sample File</span>
    </div>
  </div>

  <div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>
      <th>ID</th>
      ${s.fields.map(f => `<th>${f.label}</th>`).join('')}
      <th>Actions</th>
    </tr></thead>
    <tbody id="tbody">
      ${allRecords.length === 0 ? `<tr class="empty-row"><td colspan="${s.fields.length+2}">No records logged for ${s.title} yet.</td></tr>`
        : allRecords.slice().reverse().map(r => rowHtml(bailingSubTab, r, [])).join('')}
    </tbody>
  </table></div></div>`;

  document.getElementById('main').innerHTML = html;

  document.querySelectorAll('[data-bail-tab]').forEach(el => {
    el.addEventListener('click', () => {
      bailingSubTab = el.getAttribute('data-bail-tab');
      editingRecord = { section: null, id: null };
      renderBailingWithSubTabs();
    });
  });

  s.fields.forEach(f => {
    const el = document.querySelector(`[data-field="${f.key}"]`);
    if (!el) return;
    if (editRec) { el.value = editRec[f.key] !== undefined ? editRec[f.key] : ''; }
    else if(f.type === 'date') { el.value = todayStr(); }
  });

  if (bailingSubTab === 'bailingRaw') {
    const calcRawClosing = () => {
      const asIsOp = Number(document.querySelector(`[data-field="asIsOp"]`)?.value || 0);
      const asIsIn = Number(document.querySelector(`[data-field="asIsIn"]`)?.value || 0);
      const asIsOut = Number(document.querySelector(`[data-field="asIsOut"]`)?.value || 0);
      const asIsCl = document.querySelector(`[data-field="asIsCl"]`);
      if (asIsCl) asIsCl.value = (asIsOp + asIsIn - asIsOut).toFixed(2);

      const lmsOp = Number(document.querySelector(`[data-field="lmsOp"]`)?.value || 0);
      const lmsIn = Number(document.querySelector(`[data-field="lmsIn"]`)?.value || 0);
      const lmsOut = Number(document.querySelector(`[data-field="lmsOut"]`)?.value || 0);
      const lmsCl = document.querySelector(`[data-field="lmsCl"]`);
      if (lmsCl) lmsCl.value = (lmsOp + lmsIn - lmsOut).toFixed(2);

      const hmsOp = Number(document.querySelector(`[data-field="hmsOp"]`)?.value || 0);
      const hmsIn = Number(document.querySelector(`[data-field="hmsIn"]`)?.value || 0);
      const hmsOut = Number(document.querySelector(`[data-field="hmsOut"]`)?.value || 0);
      const hmsCl = document.querySelector(`[data-field="hmsCl"]`);
      if (hmsCl) hmsCl.value = (hmsOp + hmsIn - hmsOut).toFixed(2);
    };
    ['asIsOp','asIsIn','asIsOut','lmsOp','lmsIn','lmsOut','hmsOp','hmsIn','hmsOut'].forEach(k => {
      const el = document.querySelector(`[data-field="${k}"]`);
      if (el) el.addEventListener('input', calcRawClosing);
    });
  } else if (bailingSubTab === 'gasCutting') {
    const calcGasBalance = () => {
      const op = Number(document.querySelector(`[data-field="openingWt"]`)?.value || 0);
      const inw = Number(document.querySelector(`[data-field="inwardWt"]`)?.value || 0);
      const inputWt = Number(document.querySelector(`[data-field="inputWt"]`)?.value || 0);
      const balEl = document.querySelector(`[data-field="balanceWt"]`);
      if (balEl) balEl.value = (op + inw - inputWt).toFixed(2);
    };
    ['openingWt','inwardWt','inputWt'].forEach(k => {
      const el = document.querySelector(`[data-field="${k}"]`);
      if (el) el.addEventListener('input', calcGasBalance);
    });
  } else if (bailingSubTab === 'bailingProd') {
    const calcBaleBalance = () => {
      const asIs = Number(document.querySelector(`[data-field="asIsInput"]`)?.value || 0);
      const lms = Number(document.querySelector(`[data-field="lmsInput"]`)?.value || 0);
      const totInEl = document.querySelector(`[data-field="totalInput"]`);
      if (totInEl) totInEl.value = (asIs + lms).toFixed(2);

      const op = Number(document.querySelector(`[data-field="openingWt"]`)?.value || 0);
      const prod = Number(document.querySelector(`[data-field="prodWt"]`)?.value || 0);
      const balEl = document.querySelector(`[data-field="balanceWt"]`);
      if (balEl) balEl.value = (op + (asIs + lms) - prod).toFixed(2);
    };
    ['asIsInput','lmsInput','openingWt','prodWt'].forEach(k => {
      const el = document.querySelector(`[data-field="${k}"]`);
      if (el) el.addEventListener('input', calcBaleBalance);
    });
  }

  document.getElementById('addBtn').addEventListener('click', () => handleAdd(bailingSubTab));
  const resetBtn = document.getElementById('resetFormBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => { editingRecord = { section: null, id: null }; renderBailingWithSubTabs(); });

  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => handleDelete(bailingSubTab, btn.getAttribute('data-id')));
  });
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => { editingRecord = { section: bailingSubTab, id: btn.getAttribute('data-id') }; renderBailingWithSubTabs(); });
  });

  const exportBtn = document.getElementById('exportCsvBtn');
  if (exportBtn) {
    exportBtn.addEventListener('click', () => {
      const header = ['ID', ...s.fields.map(f => f.label)];
      const rows = allRecords.map(r => [r.id, ...s.fields.map(f => csvCellValue(f, r, []))]);
      downloadStyledReport(`${slugify(s.title)}-${todayStr()}.csv`, header, rows, null);
    });
  }
  const importBtn = document.getElementById('importBtn');
  if (importBtn) importBtn.addEventListener('click', () => triggerImport(bailingSubTab));
  const sampleBtn = document.getElementById('downloadSampleBtn');
  if (sampleBtn) sampleBtn.addEventListener('click', () => downloadSampleFile(bailingSubTab));
}

// GENERIC SECTION HANDLER
function renderSection(key) {
  const s = SECTIONS[key];
  if(!s) return;
  const allRecords = DATA[key] || [];
  const vopts = vehicleOptions();
  const isEditing = editingRecord.section === key && editingRecord.id;
  const editRec = isEditing ? allRecords.find(r => r.id === editingRecord.id) : null;

  const filt = sectionFilters[key] || (sectionFilters[key] = { search: '' });
  const matchesSearch = (r, q) => {
    const needle = (q || '').trim().toLowerCase();
    if (!needle) return true;
    if (String(r.id || '').toLowerCase().includes(needle)) return true;
    return s.fields.some(f => String(csvCellValue(f, r, vopts) || '').toLowerCase().includes(needle));
  };
  const records = allRecords.filter(r => matchesSearch(r, filt.search));

  let html = `<h1>${s.title}</h1>
  <div class="phase-tag">${s.phaseLabel || ''}</div>
  <div class="desc">${s.desc || ''}</div>

  <div class="form-panel">
    ${editRec ? `<div class="editing-flag" style="margin-bottom:12px;">Editing ${editRec.id}</div>` : `<div class="editing-flag" style="margin-bottom:12px;color:var(--navy);">New ${s.title} Entry</div>`}
    <div class="form-grid" id="formGrid">
      ${s.fields.map(f => `<div class="field"><label>${f.label}${f.required?' *':''}</label>${fieldInput(f, vopts, key)}</div>`).join('')}
    </div>
    <div class="form-actions">
      <button class="primary" id="addBtn">${editRec ? 'Save Changes' : 'Add Record'}</button>
      <button type="button" class="cancel-edit-btn" id="resetFormBtn">${editRec ? 'Cancel Edit' : 'Reset Fields'}</button>
      <button type="button" class="add-field-btn" onclick="window.promptAddCustomField('${key}')">＋ Add Custom Field</button>
      <span class="form-note" id="formNote"></span>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-bar">
      <input type="text" id="sectionSearchInput" placeholder="Search ${s.title}…" value="${(filt.search||'').replace(/"/g,'&quot;')}">
      ${filt.search ? '<button class="mini-btn" id="clearSectionSearchBtn">Clear</button>' : ''}
    </div>
    <div class="action-group">
      <button class="mini-btn import-btn" id="importBtn">Import Data</button>
      <button class="mini-btn export-btn" id="exportCsvBtn">Export Excel</button>
      <span class="template-link" id="downloadSampleBtn">Sample File</span>
    </div>
  </div>

  <div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>
      <th>ID</th>
      ${s.fields.map(f => `<th>${f.label}</th>`).join('')}
      <th>Actions</th>
    </tr></thead>
    <tbody id="tbody">
      ${records.length === 0 ? `<tr class="empty-row"><td colspan="${s.fields.length+2}">No records logged yet.</td></tr>`
        : records.slice().reverse().map(r => rowHtml(key, r, vopts)).join('')}
    </tbody>
  </table></div></div>`;

  document.getElementById('main').innerHTML = html;

  s.fields.forEach(f => {
    const el = document.querySelector(`[data-field="${f.key}"]`);
    if (!el) return;
    if (editRec) { el.value = editRec[f.key] !== undefined ? editRec[f.key] : ''; }
    else if(f.type === 'date') { el.value = todayStr(); }
  });

  document.getElementById('addBtn').addEventListener('click', () => handleAdd(key));
  const resetBtn = document.getElementById('resetFormBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => { editingRecord = { section: null, id: null }; renderSection(key); });

  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => handleDelete(key, btn.getAttribute('data-id')));
  });
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => { editingRecord = { section: key, id: btn.getAttribute('data-id') }; renderSection(key); });
  });

  const searchInput = document.getElementById('sectionSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      sectionFilters[key] = sectionFilters[key] || {};
      sectionFilters[key].search = searchInput.value;
      const caret = searchInput.selectionStart;
      renderSection(key);
      const newInput = document.getElementById('sectionSearchInput');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(caret, caret); }
    });
  }
  const clearBtn = document.getElementById('clearSectionSearchBtn');
  if (clearBtn) clearBtn.addEventListener('click', () => { sectionFilters[key].search = ''; renderSection(key); });

  const exportBtn = document.getElementById('exportCsvBtn');
  if (exportBtn) {
    exportBtn.addEventListener('click', () => {
      const header = ['ID', ...s.fields.map(f => f.label)];
      const rows = records.map(r => [r.id, ...s.fields.map(f => csvCellValue(f, r, vopts))]);
      downloadStyledReport(`${slugify(s.title)}-${todayStr()}.csv`, header, rows, null);
    });
  }
  const importBtn = document.getElementById('importBtn');
  if (importBtn) importBtn.addEventListener('click', () => triggerImport(key));
  const sampleBtn = document.getElementById('downloadSampleBtn');
  if (sampleBtn) sampleBtn.addEventListener('click', () => downloadSampleFile(key));
}

// MAIN RENDER SWITCH
function render(){
  renderSidebar();
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='stock') renderStockWithSubTabs();
  else if(currentView==='battery') renderBatteryWithSubTabs();
  else if(currentView==='catcon') renderCatConWithSubTabs();
  else if(currentView==='engineStatus') renderEngineStatusWithDashboard();
  else if(currentView==='bailing') renderBailingWithSubTabs();
  else if(currentView==='copperWire') renderCopperWireWithSubTabs();
  else renderSection(currentView);
}

function csvCellValue(f, r, vopts){
  const v = r[f.key];
  if(v===undefined || v===null || v==='') return '';
  if(f.type==='vehicleSelect'){ const match = Array.isArray(vopts) && vopts.find(o=>o.value===v); return match ? match.label : v; }
  if(CAT_LABELS[v] && (f.key==='category' || f.key==='typeOfVehicle')) return CAT_LABELS[v];
  return v;
}

function escapeHtml(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtCell(key, f, r, vopts){
  const v = r[f.key];
  if(v===undefined || v==='') return '<span style="color:var(--text-dim)">—</span>';
  if(f.type==='vehicleSelect'){ const match = Array.isArray(vopts) && vopts.find(o=>o.value===v); return match ? match.label.split(' — ').join(' · ') : v; }
  if(f.key==='category' || (f.type==='select' && CATS.includes(v))){ return `<span class="cat-pill cat-${v}">${CAT_LABELS[v]||v}</span>`; }
  if(f.key==='remarks' && key==='engineStatus'){
    if(v==='With Mechanical') return `<span class="status-badge status-mech">${v}</span>`;
    if(v==='Only Engine') return `<span class="status-badge status-eng">${v}</span>`;
    if(v==='Only Mechanical') return `<span class="status-badge status-onlymech">${v}</span>`;
  }
  if(f.key==='floorDays' && key==='engineStatus'){
    const n = parseInt(v, 10);
    if (!isNaN(n)) {
      if (n > 90) return `<span style="color:var(--red); font-weight:700;">${n} Days</span>`;
      if (n > 60) return `<span style="color:#FFAA00; font-weight:600;">${n} Days</span>`;
      return `<span style="color:var(--navy);">${n} Days</span>`;
    }
  }
  if(f.key==='status' && key==='catcon'){
    if(v==='Available') return `<span class="status-badge" style="background:#0F331A;color:#00FF66;border:1px solid rgba(0,255,102,0.4);">Available</span>`;
    if(v==='Sold') return `<span class="status-badge" style="background:#33260F;color:#FFAA00;border:1px solid rgba(255,170,0,0.4);">Sold</span>`;
  }
  if(f.key==='condition' && key==='catcon'){
    if(v==='Full') return `<span class="status-badge" style="background:#0F331A;color:#00FF66;border:1px solid rgba(0,255,102,0.3);">Full</span>`;
    if(v==='Half') return `<span class="status-badge" style="background:#33260F;color:#FFAA00;border:1px solid rgba(255,170,0,0.3);">Half</span>`;
    if(v==='Empty') return `<span class="status-badge" style="background:#331111;color:#FF4444;border:1px solid rgba(255,68,68,0.3);">Empty</span>`;
  }
  return v;
}

function rowHtml(key, r, vopts){
  const s = SECTIONS[key];
  return `<tr><td class="id-cell">${r.id}</td>${s.fields.map(f=>`<td>${fmtCell(key,f,r,vopts)}</td>`).join('')}<td><div class="row-actions"><button class="edit-btn" data-id="${r.id}">Edit</button><button class="del-btn" data-id="${r.id}">Remove</button></div></td></tr>`;
}

// -------------------------------------------------------------
// SAVE & DELETE WITH LIVE RE-CALCULATION
async function handleAdd(key){
  const s = SECTIONS[key];
  const isEditing = editingRecord.section===key && editingRecord.id;
  const rec = {};
  let ok = true;
  s.fields.forEach(f=>{
    if (f.type === 'readonly') return;
    const el = document.querySelector(`[data-field="${f.key}"]`);
    const val = el ? el.value : '';
    if(f.required && !val) ok = false;
    rec[f.key] = val;
  });
  if(!ok){ document.getElementById('formNote').textContent = 'Fill all required fields (*) before adding.'; return; }

  if(key === 'stock') {
    const opQ = Number(rec.openingQty)||0, inQ = Number(rec.inwardQty)||0, outQ = Number(rec.outwardQty)||0, disQ = Number(rec.dismantleQty)||0;
    rec.closingQty = opQ + inQ - outQ - disQ;
    const opW = Number(rec.openingWeight)||0, inW = Number(rec.inwardWeight)||0, outW = Number(rec.outwardWeight)||0, disW = Number(rec.dismantleWeight)||0;
    rec.closingWeight = (opW + inW - outW - disW).toFixed(2);
  } else if (key === 'bailingRaw') {
    const asIsOp = Number(rec.asIsOp) || 0, asIsIn = Number(rec.asIsIn) || 0, asIsOut = Number(rec.asIsOut) || 0;
    rec.asIsCl = (asIsOp + asIsIn - asIsOut).toFixed(2);
    const lmsOp = Number(rec.lmsOp) || 0, lmsIn = Number(rec.lmsIn) || 0, lmsOut = Number(rec.lmsOut) || 0;
    rec.lmsCl = (lmsOp + lmsIn - lmsOut).toFixed(2);
    const hmsOp = Number(rec.hmsOp) || 0, hmsIn = Number(rec.hmsIn) || 0, hmsOut = Number(rec.hmsOut) || 0;
    rec.hmsCl = (hmsOp + hmsIn - hmsOut).toFixed(2);
  } else if (key === 'gasCutting') {
    const op = Number(rec.openingWt) || 0, inw = Number(rec.inwardWt) || 0, inputWt = Number(rec.inputWt) || 0;
    rec.balanceWt = (op + inw - inputWt).toFixed(2);
  } else if (key === 'bailingProd') {
    const asIs = Number(rec.asIsInput) || 0, lms = Number(rec.lmsInput) || 0;
    rec.totalInput = (asIs + lms).toFixed(2);
    const op = Number(rec.openingWt) || 0, prod = Number(rec.prodWt) || 0;
    rec.balanceWt = (op + (asIs + lms) - prod).toFixed(2);
  } else if (key === 'batteryDaily') {
    const inw = Number(rec.inward) || 0, outw = Number(rec.outward) || 0;
    rec.balance = inw - outw;
  } else if (key === 'engineStatus') {
    rec.floorDays = calcFloorDays(rec.dismantleDate || rec.date);
  }

  DATA[key] = DATA[key]||[];
  if(isEditing){
    const idx = DATA[key].findIndex(r=>r.id===editingRecord.id);
    if(idx>-1){ rec.id = editingRecord.id; DATA[key][idx] = rec; }
    editingRecord = { section:null, id:null };
  } else {
    rec.id = nextId(s.idPrefix);
    DATA[key].push(rec);
  }

  await window.dbEngine.saveRecord(key, rec);
  flashSaved();
  render();
}

async function handleDelete(key, id){
  if(!window.confirm('Remove this record? This cannot be undone.')) return;
  DATA[key] = (DATA[key]||[]).filter(r=>r.id!==id);
  await window.dbEngine.deleteRecord(key, id);
  flashSaved();
  if(editingRecord.section===key && editingRecord.id===id) editingRecord = { section:null, id:null };
  render();
}

function promptAddCustomField(sectionKey) {
  const fieldName = prompt("Enter the name for the new custom field:");
  if (!fieldName || !fieldName.trim()) return;
  const key = fieldName.trim().replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
  SECTIONS[sectionKey].fields.push({ key, label: fieldName.trim(), type: 'text' });
  render();
}
window.promptAddCustomField = promptAddCustomField;

function slugify(str){ return String(str).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'export'; }

function downloadStyledReport(filename, headerRow, dataRows, rowColors){
  const escapeCSV = (val) => {
    let str = String(val === undefined || val === null ? '' : val);
    if (/[",\n\r]/.test(str)) { str = '"' + str.replace(/"/g, '""') + '"'; }
    return str;
  };
  const csvContent = '\ufeff' + [ headerRow.map(escapeCSV).join(','), ...dataRows.map(row => row.map(escapeCSV).join(',')) ].join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function downloadSampleFile(key){
  const s = SECTIONS[key];
  const headers = s.fields.map(f => f.label);
  const sampleValues = s.fields.map(f => {
    if(f.type === 'date') return todayStr();
    if(f.type === 'number') return '10';
    if(f.type === 'select') return f.options[0];
    if(f.type === 'vehicleSelect') return 'VEH-0001';
    return 'Sample Text';
  });

  const escapeCSV = (val) => {
    let str = String(val === undefined || val === null ? '' : val);
    if (/[",\n\r]/.test(str)) { str = '"' + str.replace(/"/g, '""') + '"'; }
    return str;
  };

  const csvContent = '\ufeff' + [ headers.map(escapeCSV).join(','), sampleValues.map(escapeCSV).join(',') ].join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Sample_${slugify(s.title)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function triggerImport(key){
  const input = document.getElementById('fileImporter');
  input.value = '';
  input.onchange = (e) => handleFileImport(e, key);
  input.click();
}

function handleFileImport(e, key){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => { parseAndImport(evt.target.result, key); };
  reader.readAsText(file);
}

function matchFieldHeader(field, headerText) {
  return headerText.trim().toLowerCase() === field.label.trim().toLowerCase();
}

function parseCSVRow(rowStr, delim = ',') {
  const result = [];
  let current = ''; let inQuotes = false;
  for(let i = 0; i < rowStr.length; i++){
    const char = rowStr[i];
    if(char === '"') { inQuotes = !inQuotes; } 
    else if(char === delim && !inQuotes){
      let val = current.trim();
      if(val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
      result.push(val.replace(/""/g, '"').trim());
      current = '';
    } else { current += char; }
  }
  let val = current.trim();
  if(val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
  result.push(val.replace(/""/g, '"').trim());
  return result;
}

async function parseAndImport(content, key){
  const s = SECTIONS[key];
  DATA[key] = DATA[key] || [];
  const lines = content.split(/\r\n|\n/).filter(line => line.trim() !== '');
  if(lines.length < 2){ alert('No data rows found in the imported file.'); return; }
  
  const headers = parseCSVRow(lines[0]);
  const newRecords = [];

  for(let i = 1; i < lines.length; i++){
    const cells = parseCSVRow(lines[i]);
    if(cells.length === 0) continue;
    const rawRec = {};
    s.fields.forEach(f => {
      let idx = headers.findIndex(h => matchFieldHeader(f, h));
      rawRec[f.key] = idx > -1 && cells[idx] !== undefined ? cells[idx] : '';
    });
    rawRec.id = nextId(s.idPrefix);
    DATA[key].push(rawRec);
    newRecords.push(rawRec);
  }

  if(newRecords.length > 0){
    await window.dbEngine.batchSave(key, newRecords);
    alert(`Imported ${newRecords.length} records successfully!`);
    render();
  }
}
